services:
  # 1. Qdrant Vector Database Service
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # 2. Redis Task Broker & Result Store
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
    restart: always

  # 3. FastAPI Application Service
  wings_retrival_ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wings_retrival_ai
    ports:
      - "4500:4500"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 4500 --reload
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - redis
    restart: always

  # 4. Asynchronous Ingestion Worker Service
  wings_ingestion_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wings_ingestion_worker
    volumes:
      - .:/app
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - redis
    restart: always

volumes:
  qdrant_data:
