# docker-compose.yml
version: '3.8'

services:
  # 1. Qdrant Vector Database Service
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # 2. FastAPI Application Service
  wings_retrival_ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wings_retrival_ai
    ports:
      - "4500:4500"
    volumes:
      - .:/app    # <--- Live sync local code with container
    command: uvicorn app.main:app --host 0.0.0.0 --port 4500 --reload  # <--- Auto reload on edit
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    restart: always


volumes:
  qdrant_data:
