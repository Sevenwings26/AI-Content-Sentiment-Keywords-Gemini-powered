<!-- app/templates/components/modals/persona_modal.html -->
<div id="persona-modal" class="modal-backdrop" onclick="if(event.target === this) closeModal('persona-modal')">
    <div class="modal-box">
        <div class="modal-header">
            <div>
                <h3 class="modal-title">Create Governed Assistant Persona</h3>
                <p class="text-sm text-secondary" style="margin-top: 2px;">Enforce guardrails and system instructions for AI responses</p>
            </div>
            <button type="button" class="modal-close" onclick="closeModal('persona-modal')" aria-label="Close modal">&times;</button>
        </div>
        <form id="create-persona-form" onsubmit="handleCreatePersona(event)">
            <div class="form-group">
                <label class="form-label" for="persona-name">Persona Name</label>
                <input type="text" id="persona-name" class="form-input" placeholder="e.g. Legal Compliance Advisor" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="persona-desc">Description</label>
                <input type="text" id="persona-desc" class="form-input" placeholder="Specialized in contractual review & NDA analysis">
            </div>
            <div class="form-group">
                <label class="form-label" for="persona-template">System Instruction Template</label>
                <textarea id="persona-template" class="form-textarea" rows="4" placeholder="You are an enterprise legal compliance assistant. Provide concise, grounded answers using strictly verified clauses from the indexed knowledge base." required></textarea>
                <span class="form-hint">Prepended to LLM prompt context to enforce domain tone and behavioral constraints.</span>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="closeModal('persona-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary" id="btn-submit-persona">Save Persona</button>
            </div>
        </form>
    </div>
</div>
