<!-- app/templates/components/modals/doc_modal.html -->
<div id="doc-modal" class="modal-backdrop" onclick="if(event.target === this) closeModal('doc-modal')">
    <div class="modal-box">
        <div class="modal-header">
            <div>
                <h3 class="modal-title">Upload Enterprise Knowledge Document</h3>
                <p class="text-sm text-secondary" style="margin-top: 2px;">Ingest, chunk, embed, and index into vector storage with security ACLs</p>
            </div>
            <button type="button" class="modal-close" onclick="closeModal('doc-modal')" aria-label="Close modal">&times;</button>
        </div>
        <form id="upload-doc-form" onsubmit="handleUploadDocument(event)">
            <div class="form-group">
                <label class="form-label">Select File (PDF, DOCX, TXT, MD)</label>
                <div class="dropzone" id="modal-dropzone" onclick="document.getElementById('doc-file-input').click()">
                    <div style="font-size: 28px; margin-bottom: 8px;">📄</div>
                    <div style="font-weight: 600;" id="modal-dropzone-filename">Click or drag & drop a file here</div>
                    <div class="text-xs text-muted" style="margin-top: 4px;">Supported: .pdf, .docx, .txt, .md (Max 50MB)</div>
                    <input type="file" id="doc-file-input" style="display: none;" required onchange="handleModalFileSelect(this)">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="doc-acl-select">Security Access Clearance (ACL)</label>
                <select id="doc-acl-select" class="form-select" required>
                    <option value="DEPARTMENT">DEPARTMENT (Clearance for Department Members)</option>
                    <option value="PUBLIC">PUBLIC (Searchable Tenant-Wide across all depts)</option>
                    <option value="CONFIDENTIAL">CONFIDENTIAL (DeptAdmins & SuperAdmins only)</option>
                    <option value="RESTRICTED">RESTRICTED (Private to Uploader & SuperAdmin)</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="doc-dept-select">Target Department Scope</label>
                <select id="doc-dept-select" class="form-select"></select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="closeModal('doc-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary" id="upload-doc-btn">
                    <span>Upload & Ingest</span>
                </button>
            </div>
        </form>
    </div>
</div>
