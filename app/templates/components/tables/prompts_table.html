<!-- app/templates/components/tables/prompts_table.html -->
<div id="tab-prompts" class="tab-content">
    <div class="table-container">
        <div class="flex items-center justify-between" style="padding: 20px 24px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; gap: 12px;">
            <div>
                <h2 style="font-size: 16px; font-weight: 600;">Governed Prompt Templates</h2>
                <p class="text-sm text-secondary" style="margin-top: 2px;">Curated prompts for department-specific workflows and automated tasks</p>
            </div>
            <button type="button" class="btn btn-primary btn-sm" onclick="openModal('prompt-modal')">
                <span>+ Create Template</span>
            </button>
        </div>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Template Title</th>
                        <th>Workflow Category</th>
                        <th>Department Scope</th>
                        <th>User Prompt Template</th>
                    </tr>
                </thead>
                <tbody id="prompts-table-body">
                    <tr>
                        <td colspan="4" class="text-center text-muted" style="padding: 36px 20px;">
                            <div class="spinner" style="margin-bottom: 8px;"></div>
                            <div>Loading prompt templates...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
