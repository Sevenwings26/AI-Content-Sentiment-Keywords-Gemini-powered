<!-- app/templates/components/tables/jobs_table.html -->
<div id="tab-jobs" class="tab-content">
    <div class="table-container">
        <div class="flex items-center justify-between" style="padding: 20px 24px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; gap: 12px;">
            <div>
                <h2 style="font-size: 16px; font-weight: 600;">Data Source Connector Sync Jobs</h2>
                <p class="text-sm text-secondary" style="margin-top: 2px;">Automated background connectors syncing documents from S3, Drive, Confluence, and DBs</p>
            </div>
            <button type="button" class="btn btn-primary btn-sm" onclick="openModal('job-modal')">
                <span>+ Create Sync Job</span>
            </button>
        </div>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Job Name</th>
                        <th>Source Connector</th>
                        <th>Access Clearance</th>
                        <th>Job Status</th>
                        <th>Processed Docs</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="jobs-table-body">
                    <tr>
                        <td colspan="6" class="text-center text-muted" style="padding: 36px 20px;">
                            <div class="spinner" style="margin-bottom: 8px;"></div>
                            <div>Loading connector sync jobs...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
