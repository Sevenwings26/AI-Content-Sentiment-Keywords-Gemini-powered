<!-- app/templates/components/tables/users_table.html -->
<div id="tab-users" class="tab-content active">
    <div class="table-container">
        <div class="flex items-center justify-between" style="padding: 20px 24px; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; gap: 12px;">
            <div>
                <h2 style="font-size: 16px; font-weight: 600;">Tenant User Accounts & Role Governance</h2>
                <p class="text-sm text-secondary" style="margin-top: 2px;">Manage user clearance levels, roles, and departmental boundaries</p>
            </div>
            <button type="button" class="btn btn-primary btn-sm" onclick="openModal('user-modal')">
                <span>+ Provision User</span>
            </button>
        </div>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>User Name</th>
                        <th>Email Address</th>
                        <th>Role Clearance</th>
                        <th>Department</th>
                        <th>Account Status</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr>
                        <td colspan="6" class="text-center text-muted" style="padding: 36px 20px;">
                            <div class="spinner" style="margin-bottom: 8px;"></div>
                            <div>Loading member accounts...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
