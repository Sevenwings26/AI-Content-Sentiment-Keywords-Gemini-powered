<!-- app/templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enterprise Multi-Tenant Cognitive RAG & Knowledge Governance Platform">
    <title>{% block title %}Enterprise AI Assistant & Knowledge Governance{% endblock %}</title>

    <!-- Google Fonts: Inter (300, 400, 500, 600, 700, 800) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- SweetAlert2 Modern Modal & Toast Library -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Modern Monochrome CSS Design System Tokens & Components -->
    <link rel="stylesheet" href="/static/css/theme.css">

    <!-- Inline Theme Bootstrap to Prevent Flash of Unstyled Theme (FOUT) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('app_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!-- SweetAlert2 Monochrome Theme Adaptations -->
    <style>
        .swal2-monochrome-toast {
            background-color: var(--bg-surface-elevated) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-subtle) !important;
            border-radius: var(--radius-md) !important;
            box-shadow: var(--shadow-lg) !important;
        }
        .swal2-monochrome-toast .swal2-title {
            color: var(--text-primary) !important;
            font-size: 13px !important;
            font-weight: 600 !important;
        }
        .swal2-monochrome-toast .swal2-html-container {
            color: var(--text-secondary) !important;
            font-size: 12px !important;
        }
        .swal2-popup {
            background: var(--bg-surface-elevated) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-subtle) !important;
            border-radius: var(--radius-lg) !important;
            font-family: var(--font-sans) !important;
        }
        .swal2-title {
            color: var(--text-primary) !important;
        }
        .swal2-html-container {
            color: var(--text-secondary) !important;
        }
        .swal2-light-confirm {
            background-color: #0F172A !important;
            color: #FFFFFF !important;
            border-radius: var(--radius-md) !important;
            padding: 8px 18px !important;
            font-size: 13px !important;
        }
        .swal2-dark-confirm {
            background-color: #F8FAFC !important;
            color: #090D16 !important;
            border-radius: var(--radius-md) !important;
            padding: 8px 18px !important;
            font-size: 13px !important;
        }
        .swal2-light-cancel, .swal2-dark-cancel {
            border-radius: var(--radius-md) !important;
            padding: 8px 18px !important;
            font-size: 13px !important;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Main Content Block -->
    {% block content %}{% endblock %}

    <!-- Centralized API & Authentication Controller -->
    <script src="/static/js/api.js"></script>

    <!-- Page Specific Scripts Block -->
    {% block scripts %}{% endblock %}
</body>
</html>
