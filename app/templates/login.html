<!-- app/templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Portal - Sign In & Tenant Onboarding</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(22, 30, 46, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #0284c7, #6366f1);
            --input-bg: rgba(15, 23, 42, 0.8);
            --success: #34d399;
            --danger: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #090d16 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 36px 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-gradient);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }

        .auth-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            background: var(--input-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Forms */
        .form-panel { display: none; }
        .form-panel.active { display: block; }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group { flex: 1; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
        }

        .submit-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Alert / Notification box */
        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }

        .alert-box.danger {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--danger);
        }

        .alert-box.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--success);
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .auth-footer a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="brand-badge">⚡ ENTERPRISE AI PORTAL</div>
            <h1 id="header-title">Welcome Back</h1>
            <p id="header-desc">Sign in to access your multi-tenant RAG workspace</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login-btn" onclick="selectTab('login')">Sign In</button>
            <button class="tab-btn" id="tab-register-btn" onclick="selectTab('register')">Register Tenant</button>
        </div>

        <div id="alert-box" class="alert-box"></div>

        <!-- 1. Login Form -->
        <div id="login-panel" class="form-panel active">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Work Email</label>
                    <input type="email" id="login-email" placeholder="name@company.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="submit-btn" id="login-submit-btn">Sign In to Workspace</button>
            </form>
        </div>

        <!-- 2. Onboard Tenant / Register Form -->
        <div id="register-panel" class="form-panel">
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="org-name">Organization Name</label>
                        <input type="text" id="org-name" placeholder="Acme Global Inc" required oninput="deriveSlug()">
                    </div>
                    <div class="form-group">
                        <label for="org-slug">Tenant Slug</label>
                        <input type="text" id="org-slug" placeholder="acme-global" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="admin-name">SuperAdmin Full Name</label>
                    <input type="text" id="admin-name" placeholder="Sarah Connor" required>
                </div>

                <div class="form-group">
                    <label for="admin-email">Admin Email Address</label>
                    <input type="email" id="admin-email" placeholder="admin@acmeglobal.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="admin-password">Secure Password</label>
                    <input type="password" id="admin-password" placeholder="Minimum 8 characters" required autocomplete="new-password">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dept-name">Default Department</label>
                        <input type="text" id="dept-name" value="Engineering" required>
                    </div>
                    <div class="form-group">
                        <label for="dept-code">Code</label>
                        <input type="text" id="dept-code" value="ENG" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="register-submit-btn">Provision Organization & Admin</button>
            </form>
        </div>

        <div class="auth-footer">
            <p>Protected by Enterprise Multi-Tenant RBAC & Vector Isolation</p>
            <p style="margin-top: 6px;"><a href="/">← Return to Public Chat Interface</a></p>
        </div>
    </div>

    <script>
        function showAlert(msg, type = "danger") {
            const el = document.getElementById("alert-box");
            el.className = `alert-box ${type}`;
            el.innerHTML = msg;
            el.style.display = "block";
        }

        function clearAlert() {
            const el = document.getElementById("alert-box");
            el.style.display = "none";
        }

        function selectTab(tab) {
            clearAlert();
            if (tab === "login") {
                document.getElementById("tab-login-btn").classList.add("active");
                document.getElementById("tab-register-btn").classList.remove("active");
                document.getElementById("login-panel").classList.add("active");
                document.getElementById("register-panel").classList.remove("active");
                document.getElementById("header-title").innerText = "Welcome Back";
                document.getElementById("header-desc").innerText = "Sign in to access your multi-tenant RAG workspace";
            } else {
                document.getElementById("tab-register-btn").classList.add("active");
                document.getElementById("tab-login-btn").classList.remove("active");
                document.getElementById("register-panel").classList.add("active");
                document.getElementById("login-panel").classList.remove("active");
                document.getElementById("header-title").innerText = "Register Tenant";
                document.getElementById("header-desc").innerText = "Onboard your organization and configure root SuperAdmin";
            }
        }

        function deriveSlug() {
            const name = document.getElementById("org-name").value;
            const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
            document.getElementById("org-slug").value = slug;
        }

        // --- Handle Login (OAuth2 Token Endpoint) ---
        async function handleLogin(e) {
            e.preventDefault();
            clearAlert();
            const btn = document.getElementById("login-submit-btn");
            btn.disabled = true;
            btn.innerText = "Signing in...";

            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;

            try {
                // OAuth2 uses application/x-www-form-urlencoded
                const formBody = new URLSearchParams();
                formBody.append("username", email);
                formBody.append("password", password);

                const response = await fetch("/enterprise/auth/token", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formBody.toString()
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Authentication failed. Check your credentials.");
                }

                // Store Authentication State in LocalStorage
                localStorage.setItem("enterprise_token", data.access_token);
                localStorage.setItem("enterprise_admin_token", data.access_token);
                localStorage.setItem("enterprise_user", JSON.stringify(data.user));

                showAlert("Sign in successful! Redirecting to workspace...", "success");

                setTimeout(() => {
                    window.location.href = "/";
                }, 800);

            } catch (err) {
                showAlert(err.message, "danger");
                btn.disabled = false;
                btn.innerText = "Sign In to Workspace";
            }
        }

        // --- Handle Tenant Onboarding / Registration ---
        async function handleRegister(e) {
            e.preventDefault();
            clearAlert();
            const btn = document.getElementById("register-submit-btn");
            btn.disabled = true;
            btn.innerText = "Provisioning Tenant...";

            const payload = {
                org_name: document.getElementById("org-name").value.trim(),
                org_slug: document.getElementById("org-slug").value.trim(),
                admin_name: document.getElementById("admin-name").value.trim(),
                admin_email: document.getElementById("admin-email").value.trim(),
                admin_password: document.getElementById("admin-password").value,
                department_name: document.getElementById("dept-name").value.trim(),
                department_code: document.getElementById("dept-code").value.trim()
            };

            try {
                const response = await fetch("/enterprise/auth/register-tenant", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Tenant onboarding failed.");
                }

                // Auto-authenticate with the returned token
                localStorage.setItem("enterprise_token", data.access_token);
                localStorage.setItem("enterprise_admin_token", data.access_token);
                localStorage.setItem("enterprise_user", JSON.stringify({
                    id: data.user_id,
                    full_name: payload.admin_name,
                    email: payload.admin_email,
                    role: "SUPER_ADMIN",
                    org_id: data.org_id
                }));

                showAlert(`Tenant <strong>${payload.org_name}</strong> created! Redirecting to Admin Dashboard...`, "success");

                setTimeout(() => {
                    window.location.href = "/enterprise/dashboard";
                }, 1200);

            } catch (err) {
                showAlert(err.message, "danger");
                btn.disabled = false;
                btn.innerText = "Provision Organization & Admin";
            }
        }

        // Check if URL has ?tab=register
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('tab') === 'register') {
                selectTab('register');
            }
        };
    </script>
</body>
</html>
